<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Просто Додатки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --night-bg:#1a1a22; --night-text:#f4eade;
  --day-bg:#f4eade;   --day-text:#1a1a22;
  --purple:#8800ff;   --btn-bg:#fcc232; --btn-text:#1a1a22;
  --tog-on:#42B450;
  --ua-blue:#009dff;  --ua-yellow:#fff600;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.77,0,.175,1);
  /* Figma: 168.96px at 1440px wide */
  --fs:clamp(32px,11.73vw,169px);
}

html{scroll-behavior:smooth;}
html,body{width:100%;min-height:100%;}

body{
  font-family:'Unbounded',sans-serif;
  font-weight:900;
  background:var(--day-bg);
  color:var(--day-text);
  overflow-x:hidden;
  transition:background .55s var(--smooth),color .55s var(--smooth);
}
body.night{background:var(--night-bg);color:var(--night-text);}

/* ═══════════════════════════════════════════════════════════
   PAGE LAYOUT
   Figma: flex-col gap=120px, top=-6px (eats ascender gap)
═══════════════════════════════════════════════════════════ */
.page{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(48px,8.33vw,120px);
  margin-top:-6px;
  padding-bottom:clamp(40px,5.56vw,80px);
}

/* ═══════════════════════════════════════════════════════════
   HERO — scales with viewport (mobile: same layout, smaller)
═══════════════════════════════════════════════════════════ */
.hero{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  width:100%;
  font-size:var(--fs);
  line-height:normal;
  white-space:nowrap;
  user-select:none;
}

/* Every hero row */
.row{
  display:flex;
  align-items:center;
  width:100%;
}

/* ── ROW 1: ПРОСТ + O (after T) + spacer + flag ───────── */
.row1{padding-left:clamp(4px,.56vw,8px);}
.row1-spacer{flex:1;} /* spacer between ball and flag */

#ball{
  width:clamp(60px,10.9vw,157px);
  height:clamp(51px,9.24vw,133px);
  flex-shrink:0;
  will-change:transform;
  display:flex; align-items:center;
}
#ball svg{width:100%;height:100%;display:block;}

.flag{
  display:flex;
  flex-direction:column;
  width:8px;
  /* height = same as O ball */
  height:clamp(51px,9.24vw,133px);
  flex-shrink:0;
  overflow:hidden;
  transition:width .45s cubic-bezier(.34,1.4,.64,1);
  cursor:default;
}
.flag:hover{width:120px;}
.flag .b{background:var(--ua-blue);flex:1;}
.flag .y{background:var(--ua-yellow);flex:1;}

/* ── ROW 2: ДОДАТКИ (clickable) + toggle ──────────────── */
.row2{
  justify-content:space-between;
  padding:0 clamp(4px,.56vw,8px);
}

/* Слово що клікається і міняється */
.word-cycle{
  color:var(--purple);
  flex:1;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  /* clip щоб анімація не вилазила */
  display:block;
  line-height:normal;
}
/* Внутрішній span — анімується */
.word-cycle-inner{
  display:block;
  transition:none;
}
.word-cycle-inner.slide-out-up{
  animation:slideOutUp .18s cubic-bezier(.55,0,1,.45) forwards;
}
.word-cycle-inner.slide-in-down{
  animation:slideInDown .22s cubic-bezier(0,.55,.45,1) forwards;
}
@keyframes slideOutUp{
  from{transform:translateY(0);opacity:1;}
  to{transform:translateY(-100%);opacity:0;}
}
@keyframes slideInDown{
  from{transform:translateY(100%);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

/* Toggle: Figma 248×141 at 1440. body=bg #97919d, knob right = OFF */
#tog{
  display:inline-flex;
  align-items:center;
  width:clamp(90px,17.22vw,248px);
  height:clamp(51px,9.79vw,141px);
  background:#42B450; /* day default */
  border-radius:9999px;
  padding:clamp(4px,.625vw,9px);
  cursor:pointer;
  flex-shrink:0;
  transition:background .4s ease;
}
body.day #tog{background:#42B450;}
body.night #tog{background:#010002;}

.knob{
  width:clamp(42px,7.99vw,115px);
  height:clamp(42px,7.99vw,115px);
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  border-radius:50%;
  flex-shrink:0;
  /* OFF=knob right */
  margin-left:auto;
  transition:margin .4s var(--bounce);
}
body.day .knob{margin-left:0;} /* ON=knob left */

/* ── ROW 3: НА КОЖНУ / НА КОЖЕН ──────────────────────── */
.row3{padding:0 clamp(4px,.56vw,8px);}

.night-only{display:none;}
.day-only{display:inline;}
body.night .night-only{display:inline;}
body.night .day-only{display:none;}

/* ── ROW 4: НІЧ/ДЕНЬ + button ──────────────────────────  */
.row4{
  gap:clamp(8px,1.11vw,16px);
  padding:0 clamp(4px,.56vw,8px);
}

/* BUTTON — spring morph pill */
/* Figma: font 48.757px = 0.2887*168.96; h=141px; px=40px; gap=24px */
#btn-wrap{
  position:relative;
  display:inline-block;
  /* font-size relative to hero font-size */
  font-size:clamp(16px,3.39vw,48.76px);
  font-family:'Unbounded',sans-serif;
  font-weight:900;
  flex-shrink:0;
  overflow:visible;
  transition:margin-left .55s var(--smooth);
}
#btn-shape{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
#btn-shape path{fill:var(--btn-bg);}
#btn{
  position:absolute;top:0;left:0;
  display:inline-flex;align-items:center;
  justify-content:space-between;
  gap:0;
  background:transparent;
  color:var(--btn-text);
  font-family:inherit;font-weight:900;font-size:1em;
  letter-spacing:.1em;
  padding:.82em .82em;
  border:none;outline:none;cursor:pointer;
  white-space:nowrap;
  width:auto;
}
.bl{flex:1;text-align:left;}
.ba{flex-shrink:0;width:.964em;height:1.044em;display:inline-block;}
.ba svg{width:100%;height:100%;display:block;}
.ba svg path{fill:var(--btn-text);}

/* ═══════════════════════════════════════════════════════════
   APP BANNER
═══════════════════════════════════════════════════════════ */
.app-section{
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(12px,1.67vw,24px);
  width:100%;
}
.app-eyebrow{
  font-weight:500;
  font-size:clamp(11px,1.67vw,24px);
  letter-spacing:.1em;color:#838383;text-align:center;
}
.app-name-row{
  display:flex;align-items:center;gap:1px;
  font-size:clamp(24px,4.86vw,70px);
  color:var(--purple);font-weight:900;line-height:1;
}
.app-name-icon{
  width:clamp(36px,5.67vw,81.677px);
  height:clamp(36px,4.87vw,70.05px);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  cursor:pointer;
  background:transparent;
  overflow:visible;
}
.app-name-icon img{
  width:clamp(30px,5.05vw,72.81px);
  height:clamp(25px,4.07vw,58.56px);
  object-fit:contain;
  transform:rotate(-9.75deg);
  display:block;
  background:transparent;
}
.app-name-icon img.spin{
  animation:spin360 .45s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes spin360{
  from{transform:rotate(-9.75deg);}
  to{transform:rotate(350.25deg);} /* -9.75 + 360 */
}

.appstore-btn{display:inline-block;}
.appstore-btn svg{height:clamp(34px,3.54vw,51px);width:auto;display:block;}

/* ═══════════════════════════════════════════════════════════
   COPYRIGHT
═══════════════════════════════════════════════════════════ */
.copyright{
  font-family:'Unbounded',sans-serif;
  font-weight:400;
  font-size:clamp(10px,1.11vw,16px);
  letter-spacing:.08em;
  color:#838383;
  text-align:center;
  padding:clamp(24px,2.78vw,40px) clamp(16px,2.22vw,32px);
  border-top:1px solid rgba(128,128,128,.15);
  width:100%;
  margin-top:auto;
}

/* ═══════════════════════════════════════════════════════════
   GRAIN OVERLAY
═══════════════════════════════════════════════════════════ */
body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
  pointer-events:none;z-index:800;opacity:.4;
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
// TOGGLE — night=OFF(knob right,grey) / day=ON(knob left,green)
// ═══════════════════════════════════════════════════════════
const tog = document.getElementById('tog');
let isNight = false;

const setMode = () => {
  const before = btnWrap.getBoundingClientRect().left;
  document.body.classList.toggle('night', isNight);
  document.body.classList.toggle('day', !isNight);
  tog.setAttribute('aria-checked', isNight ? 'false' : 'true');
  requestAnimationFrame(() => {
    const delta = before - btnWrap.getBoundingClientRect().left;
    if (Math.abs(delta) > 1) {
      btnWrap.style.transition = 'none';
      btnWrap.style.marginLeft = delta + 'px';
      requestAnimationFrame(() => {
        btnWrap.style.transition = 'margin-left .55s cubic-bezier(.77,0,.175,1)';
        btnWrap.style.marginLeft = '0px';
      });
    }
    setTimeout(initBtn, 650);
  });
};
tog.addEventListener('click',()=>{isNight=!isNight;setMode();});
tog.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){e.preventDefault();isNight=!isNight;setMode();}
});

// ═══════════════════════════════════════════════════════════
// WORD CYCLE — click to cycle through words with scroll animation
// ═══════════════════════════════════════════════════════════
const words = ['ДОДАТКИ','АПКИ','ПРОГИ','ТУЛЗИ','СОФТ'];
let wordIdx = 0;
let wordAnimating = false;
const wordInner = document.getElementById('wordInner');
const wordCycle = document.getElementById('wordCycle');

wordCycle.addEventListener('click', () => {
  if (wordAnimating) return;
  wordAnimating = true;
  const nextIdx = (wordIdx + 1) % words.length;

  // Slide current out up
  wordInner.classList.add('slide-out-up');

  wordInner.addEventListener('animationend', function onOut() {
    wordInner.removeEventListener('animationend', onOut);
    wordInner.classList.remove('slide-out-up');
    wordInner.textContent = words[nextIdx];
    wordIdx = nextIdx;
    // Slide new word in from bottom
    wordInner.classList.add('slide-in-down');
    wordInner.addEventListener('animationend', function onIn() {
      wordInner.removeEventListener('animationend', onIn);
      wordInner.classList.remove('slide-in-down');
      wordAnimating = false;
    }, {once:true});
  }, {once:true});
});

// ═══════════════════════════════════════════════════════════
// CAT ICON — spin 360° on hover
// ═══════════════════════════════════════════════════════════
const catImg = document.getElementById('catImg');
const catIcon = document.getElementById('catIcon');
let catSpinning = false;

catIcon.addEventListener('mouseenter', () => {
  if (catSpinning) return;
  catSpinning = true;
  catImg.classList.add('spin');
  catImg.addEventListener('animationend', () => {
    catImg.classList.remove('spin');
    catSpinning = false;
  }, {once:true});
});

// ═══════════════════════════════════════════════════════════
// RED BALL ESCAPE
// ═══════════════════════════════════════════════════════════
const ball = document.getElementById('ball');
const MAX=55, ZONE=130;
let bx=0,by=0,tx=0,ty=0,braf=null;
function btick(){
  bx+=(tx-bx)*.13; by+=(ty-by)*.13;
  ball.style.transform=`translate(${bx}px,${by}px)`;
  braf=(Math.abs(tx-bx)>.07||Math.abs(ty-by)>.07)?requestAnimationFrame(btick):null;
}
const bgo=()=>{if(!braf)braf=requestAnimationFrame(btick);};
document.addEventListener('mousemove',e=>{
  const r=ball.getBoundingClientRect();
  const ox=r.left+r.width/2, oy=r.top+r.height/2;
  const dx=e.clientX-ox, dy=e.clientY-oy, d=Math.hypot(dx,dy);
  if(d<ZONE&&d>0){const a=Math.atan2(dy,dx),f=Math.min(MAX,(1-d/ZONE)*MAX*1.7);tx=-Math.cos(a)*f;ty=-Math.sin(a)*f;}
  else{tx=0;ty=0;}
  bgo();
});
document.addEventListener('mouseleave',()=>{tx=0;ty=0;bgo();});

// ═══════════════════════════════════════════════════════════
// BUTTON SPRING MORPH
// ═══════════════════════════════════════════════════════════
const btnWrap = document.getElementById('btn-wrap');
const btn     = document.getElementById('btn');
const btnPath = document.getElementById('btn-path');
const btnSvg  = document.getElementById('btn-shape');
let springX=0,springV=0,springTarget=0,springRaf=null;
const SK=320,SD=12,DT=1/60;
let restW=0,expandW=0;

function initBtn(){
  btn.style.width='auto';
  btn.style.position='relative';
  requestAnimationFrame(()=>{
    const W=btn.offsetWidth, H=btn.offsetHeight;
    btn.style.position='absolute';
    btn.style.width=W+'px';
    btnWrap.style.width=W+'px';
    btnWrap.style.height=H+'px';
    restW=W; expandW=W;
    springX=0;springV=0;springTarget=0;
    applySpring(0);
  });
}
requestAnimationFrame(initBtn);

function buildPath(W,H,bow){
  const r=H/2,m=W/2;
  return[`M ${r} ${H}`,`Q ${m} ${H-bow} ${W-r} ${H}`,
         `A ${r} ${r} 0 0 0 ${W-r} 0`,`Q ${m} ${bow} ${r} 0`,
         `A ${r} ${r} 0 0 0 ${r} ${H}`,`Z`].join(' ');
}

function applySpring(t){
  const W=restW+(expandW-restW)*t, H=btn.offsetHeight;
  if(!W||!H)return;
  const cW=Math.max(restW*.7,W);
  btnSvg.setAttribute('viewBox',`0 0 ${cW.toFixed(1)} ${H}`);
  btnSvg.style.width=cW.toFixed(1)+'px';
  btnSvg.style.height=H+'px';
  const dist=Math.abs(springX-springTarget),vel=Math.abs(springV)*.6;
  const bow=Math.min(H*.32,(dist*.55+vel)*H);
  btn.style.width=cW.toFixed(1)+'px';
  btnPath.setAttribute('d',buildPath(cW,H,bow));
}

function springTick(){
  const f=-SK*(springX-springTarget)-SD*springV;
  springV+=f*DT; springX+=springV*DT;
  applySpring(springX);
  const ok=Math.abs(springX-springTarget)<.0008&&Math.abs(springV)<.0008;
  if(!ok){springRaf=requestAnimationFrame(springTick);}
  else{springX=springTarget;springV=0;applySpring(springX);springRaf=null;}
}
function startSpring(t){springTarget=t;if(!springRaf)springRaf=requestAnimationFrame(springTick);}

btn.addEventListener('mouseenter',()=>{
  expandW=restW+((window.innerWidth-8)-btnWrap.getBoundingClientRect().right);
  startSpring(1);
});
btn.addEventListener('mouseleave',()=>startSpring(0));
btn.addEventListener('click',()=>{
  window.location.href='mailto:hello.mars.stock@gmail.com';
});

window.addEventListener('resize',()=>setTimeout(initBtn,100));
</script>
